<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>東京住宿五選</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: same visual system as 東京紅葉七日 — a summary row of four stay cards, a comparison table, then one detail view switched by tabs. */
:root{
  --ground:#F1F2EE; --surface:#FAFAF7; --ink:#1C231F; --ink-2:#3B4540; --muted:#66706A;
  --rule:#D4D8CF; --rule-soft:#E3E6DF;
  --maple:#A93426; --maple-soft:#F4E1DC; --ginkgo:#C98F0A; --ginkgo-band:rgba(214,164,26,.17); --ginkgo-ink:#7A5600;
  --good:#2F6B45; --good-soft:#DCEBDF; --warn:#9A5B00; --warn-soft:#F5E7CC;
  --on-accent:#FFFFFF; --img-ground:#E3E6DF; --scrim:rgba(12,15,13,.92);
  --line-seibu:#2E7EC2; --line-oedo:#B6007A; --line-tozai:#009BBF; --line-marunouchi:#E60012;
  --map-l:block; --map-d:none;
  --line-tojo:#1F4E9C; --line-fukutoshin:#9C5E31; --line-yamanote:#80C241; --line-yurakucho:#C1A470; --line-mita:#0079C2; --line-saikyo:#00AC9A; --line-arakawa:#E85298; --line-namboku:#00ADA9; --line-keihin:#00B2E5; --line-bus:#8A8F8B;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Noto Sans TC","Microsoft JhengHei",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121614; --surface:#1A1F1C; --ink:#E7EAE4; --ink-2:#C4CBC3; --muted:#97A19A;
    --rule:#313934; --rule-soft:#232926;
    --maple:#E4705F; --maple-soft:#3A2420; --ginkgo:#E2B544; --ginkgo-band:rgba(226,181,68,.15); --ginkgo-ink:#E9C56A;
    --good:#7CC795; --good-soft:#1E3326; --warn:#E6B566; --warn-soft:#3A2D16;
    --on-accent:#1A0E0B; --img-ground:#232926; --scrim:rgba(6,8,7,.94);
    --map-l:none; --map-d:block;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121614; --surface:#1A1F1C; --ink:#E7EAE4; --ink-2:#C4CBC3; --muted:#97A19A;
  --rule:#313934; --rule-soft:#232926;
  --maple:#E4705F; --maple-soft:#3A2420; --ginkgo:#E2B544; --ginkgo-band:rgba(226,181,68,.15); --ginkgo-ink:#E9C56A;
  --good:#7CC795; --good-soft:#1E3326; --warn:#E6B566; --warn-soft:#3A2D16;
  --on-accent:#1A0E0B; --img-ground:#232926; --scrim:rgba(6,8,7,.94);
  --map-l:none; --map-d:block;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.7}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:36px 88px;display:flex;flex-direction:column;gap:56px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maple);outline-offset:2px;border-radius:3px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12.5px;letter-spacing:.08em;color:var(--muted);font-weight:500}
img{display:block;max-width:100%}

/* header */
.head{display:flex;flex-direction:column;gap:14px}
.head h1{font-family:var(--f-display);font-size:clamp(34px,6vw,54px);line-height:1.15;letter-spacing:.02em}
.head h1 em{font-style:normal;color:var(--maple)}
.lede{font-size:17px;color:var(--ink-2);max-width:44em}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:4px 0 0}
.facts div{padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.facts div + div{border-left:1px solid var(--rule-soft)}
.facts dt{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.facts dd{margin:0;font-weight:500}

/* section heads */
.sec{display:flex;flex-direction:column;gap:20px;scroll-margin-top:60px}
.sec-head{display:flex;flex-direction:column;gap:6px;max-width:50em}
.sec-head h2{font-family:var(--f-display);font-size:28px;line-height:1.25}
.sec-head p{color:var(--ink-2)}

/* stay cards */
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow:hidden;text-align:left;padding:0;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:var(--maple)}
.card[aria-pressed="true"]{border-color:var(--maple);box-shadow:0 0 0 1.5px var(--maple)}
.card img{width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--img-ground)}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1;width:100%}
.card-top{display:flex;align-items:baseline;gap:8px}
.badge{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--maple)}
.card h3{font-size:16px;line-height:1.4}
.card .sub{font-size:12.5px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{font-family:var(--f-mono);font-size:21px;font-weight:600}
.price span{font-size:12.5px;color:var(--muted)}
.tbd{color:var(--muted)!important;font-weight:500}
.mini dd.no{color:var(--muted)}
.mini{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 10px;font-size:13px;margin:auto 0 0;padding-top:8px;border-top:1px solid var(--rule-soft)}
.mini dt{color:var(--muted)}
.mini dd{margin:0;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;line-height:1.7;padding:0 8px;border-radius:99px;font-weight:500}
.swipe-hint{display:none;font-size:12.5px;color:var(--muted);margin-top:-8px}
.pill.rank{background:var(--maple-soft);color:var(--maple)}
.ranklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px;background:var(--surface);overflow:hidden}
.ranklist li + li{border-top:1px solid var(--rule-soft)}
.ranklist button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:40px minmax(150px,200px) minmax(0,1fr);gap:4px 16px;align-items:start;padding:14px 16px}
.ranklist button:hover{background:var(--ground)}
.ranklist button:focus-visible{outline:2px solid var(--maple);outline-offset:-2px}
.ranklist .rk{font-size:24px;font-weight:600;color:var(--maple);line-height:1.2}
.ranklist .rn{display:flex;flex-direction:column}
.ranklist .rn small{color:var(--muted);font-size:13px}
.ranklist .rt{font-size:14.5px;color:var(--ink-2)}
@media (max-width:620px){.ranklist button{grid-template-columns:32px minmax(0,1fr)}.ranklist .rt{grid-column:2}}
.verdict{background:var(--maple-soft);border-radius:6px;padding:12px 16px;color:var(--ink);font-size:15px}
.verdict b{color:var(--maple);margin-right:10px}
.pill.booked{background:var(--maple);color:var(--on-accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* comparison table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule-soft)}
thead th{font-size:13px;color:var(--muted);font-weight:500;background:var(--surface);position:sticky;top:0}
thead th b{display:block;color:var(--ink);font-size:14.5px}
tbody th{font-weight:500;color:var(--muted);white-space:nowrap;font-size:13px}
td.best{background:var(--good-soft)}
td.best::after{content:" ★";color:var(--good);font-size:12px}
td.bad{background:var(--warn-soft)}
tr:last-child th,tr:last-child td{border-bottom:0}
.tbl-note{font-size:12.5px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--ground);z-index:5}
.tabs button{border:0;background:none;padding:12px 14px 10px;cursor:pointer;color:var(--ink-2);border-bottom:2.5px solid transparent;white-space:nowrap;font-size:14.5px}
.tabs button:hover{color:var(--maple)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--maple)}
.tabs .badge{margin-right:4px}

.detail{display:flex;flex-direction:column;gap:36px;padding-top:8px}
.d-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.d-head h3{font-family:var(--f-display);font-size:30px;line-height:1.2}
.d-head .sub{color:var(--muted);font-size:14px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 12px;border:1px solid var(--rule);border-radius:99px;text-decoration:none;background:var(--surface);cursor:pointer}
.btn:hover{border-color:var(--maple);color:var(--maple)}
.block{display:flex;flex-direction:column;gap:14px}
.block > h4{font-size:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:6px}
.block > h4 small{font-size:13px;color:var(--muted);font-weight:400}

/* gallery */
.gal{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.gal-main{position:relative;background:var(--img-ground);border-radius:6px;overflow:hidden;aspect-ratio:16/10;cursor:zoom-in}
.gal-main img{width:100%;height:100%;object-fit:contain}
.gal-cap{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:13px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.gal-nav:hover{background:rgba(0,0,0,.7)}
.gal-nav.prev{left:10px}.gal-nav.next{right:10px}
.gal-count{position:absolute;top:10px;right:12px;font-family:var(--f-mono);font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:1px 8px;border-radius:99px}
.gal-filter{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:3px 12px;border-radius:99px;border:1px solid var(--rule);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--maple);border-color:var(--maple);color:var(--on-accent)}
.thumbs{display:grid;grid-auto-flow:column;grid-auto-columns:112px;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.thumbs button{padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;cursor:pointer;background:var(--img-ground);scroll-snap-align:start}
.thumbs button[aria-current="true"]{border-color:var(--maple)}
.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover}

/* floors */
.floors{display:grid;grid-template-columns:repeat(var(--fc,3),minmax(0,1fr));gap:14px}
.floor{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.floor h5{margin:0;font-family:var(--f-mono);font-size:15px;color:var(--maple)}
.floor h5 span{font-family:var(--f-body);color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px}
.room{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:4px;background:var(--ground)}
.room b{font-size:14.5px}
.room .beds{display:flex;flex-wrap:wrap;gap:4px}
.bed{font-size:12px;padding:0 7px;border-radius:3px;border:1px solid var(--rule);background:var(--surface);white-space:nowrap}
.bed.real{border-color:var(--good);color:var(--good)}
.room p{font-size:12.5px;color:var(--muted)}
.room.wet{background:transparent;border:1px dashed var(--rule)}
.floor-plan{display:flex;gap:8px;flex-wrap:wrap}
.layout-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:10px 14px}
.stat dt{font-size:12.5px;color:var(--muted)}
.stat dd{margin:0;font-size:20px;font-weight:600;font-family:var(--f-mono)}
.stat dd small{font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--muted);margin-left:4px}
.sleep{font-size:14px;color:var(--ink-2);background:var(--ginkgo-band);padding:10px 14px;border-radius:6px}

/* transit */
.transit{display:flex;flex-direction:column;gap:10px}
.tr-row{display:grid;grid-template-columns:72px minmax(0,1fr) 64px;gap:12px;align-items:center}
.tr-dest{font-weight:700}
.tr-bar{position:relative;height:26px;background:var(--rule-soft);border-radius:4px;overflow:hidden;display:flex}
.tr-bar span{height:100%;display:flex;align-items:center;padding-left:6px;font-size:11.5px;color:#fff;white-space:nowrap;overflow:hidden}
.tr-bar .walk{background:repeating-linear-gradient(45deg,var(--muted),var(--muted) 4px,var(--ink-2) 4px,var(--ink-2) 8px)}
.tr-bar .wait{background:var(--rule)}
.tr-min{font-family:var(--f-mono);font-weight:600;font-size:17px;text-align:right}
.tr-min small{font-size:11px;font-weight:400;color:var(--muted)}
.tr-route{grid-column:2 / 4;font-size:13px;color:var(--ink-2);margin-top:-4px}
.tr-route a{color:var(--muted)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:84px;margin-right:76px}
.stations{display:flex;flex-direction:column;gap:6px}
.st{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14.5px}
.st .walkmin{font-family:var(--f-mono);font-weight:600;min-width:58px}
.ln{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:0 8px;border-radius:99px;border:1.5px solid var(--c);color:var(--ink-2)}
.ln::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}

/* nearby */
.near-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h5{margin:0;font-size:15px}
.panel h5 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.meter{display:grid;grid-template-columns:76px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:13px}
.meter .track{height:10px;background:var(--rule-soft);border-radius:99px;overflow:hidden}
.meter .fill{height:100%;background:var(--ginkgo);border-radius:99px}
.meter .v{font-family:var(--f-mono);text-align:right}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.plist .nm{min-width:0}
.plist .nm small{color:var(--muted);margin-left:4px;font-size:12px}
.plist .rt{font-family:var(--f-mono);font-weight:600;color:var(--maple)}
.plist .ds{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.plist .why{grid-column:1 / -1;font-size:12.5px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted)}

/* notes */
.pc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pc ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:14.5px;color:var(--ink-2)}
.pc .panel.pro{border-top:3px solid var(--good)}
.pc .panel.con{border-top:3px solid var(--warn)}
.facts-list{display:flex;flex-wrap:wrap;gap:6px}
.facts-list span{font-size:12.5px;padding:1px 9px;border-radius:99px;border:1px solid var(--rule);color:var(--ink-2)}

/* map */
.map-wrap{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px;overflow-x:auto}
.geo{position:relative;margin:0 auto;max-width:100%}
.geo img{width:100%;height:auto;border-radius:4px}
.geo .tile-d{display:var(--map-d)}.geo .tile-l{display:var(--map-l)}
.geo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.geo text{font-family:var(--f-body);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.geo-overview{width:min(100%,760px)}
.geo:not(.geo-overview) svg{overflow:hidden}
.block > .geo{width:min(100%,760px);margin:0}
.block > .legend{max-width:760px}
.addr-list{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px;font-size:14px}
.addr-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.addr-list b{font-weight:600}
.addr-list small{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);padding:6px 4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.d-price{display:flex;gap:10px 28px;flex-wrap:wrap;align-items:baseline;padding:12px 16px;margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px}
.d-price div{display:flex;flex-direction:column}
.d-price dt{font-size:12.5px;color:var(--muted)}
.d-price dd{margin:0;font-family:var(--f-mono);font-weight:600;font-size:24px}
.d-price dd small{font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--muted);margin-left:6px}
.d-price .note{font-size:12.5px;color:var(--muted);flex-basis:100%}
.cat-tag{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:3px;background:var(--maple);color:var(--on-accent);margin-right:6px}
.thumbs button{position:relative}
.thumbs .tc{position:absolute;left:3px;bottom:3px;font-size:10.5px;line-height:1.5;padding:0 5px;border-radius:3px;background:rgba(0,0,0,.6);color:#fff}

/* lightbox */
.lb{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain}
.lb p{color:#eee;font-size:14px;text-align:center}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer}
.lb .gal-nav{background:rgba(255,255,255,.15)}
.lb .prev{left:max(10px,env(safe-area-inset-left,0px))}.lb .next{right:max(10px,env(safe-area-inset-right,0px))}

@media (max-width:900px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .floors{grid-template-columns:minmax(0,1fr)}
  .layout-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts div:nth-child(3){border-left:0}
  .near-grid,.pc{grid-template-columns:minmax(0,1fr)}
  .tr-row{grid-template-columns:56px minmax(0,1fr) 56px;gap:8px}
  .scale{margin-left:64px;margin-right:64px}
  .d-head h3{font-size:24px}
}
@media (max-width:620px){

function px(m, lat, lng){
  const n = 256 * 2 ** m.z;
  const x = (lng + 180) / 360 * n - m.x0;
  const r = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n - m.y0;
  return [x, y];
}
function geo(name, m, inner, cls){
  return `<div class="geo ${cls || ''}"><img class="tile-l" src="maps/${name}-l.jpg" alt="" width="${m.w}" height="${m.h}"><img class="tile-d" src="maps/${name}-d.jpg" alt="" width="${m.w}" height="${m.h}">
    <svg viewBox="0 0 ${m.w} ${m.h}" aria-hidden="true">${inner}</svg></div>`;
}
function miniMap(s){
  const m = MAPS[s.id];
  const it = (NEAR[s.id] && NEAR[s.id].items) || [];
  const mPerPx = 156543.03 * Math.cos(s.lat * Math.PI / 180) / 2 ** m.z;
  const [cx, cy] = px(m, s.lat, s.lng);
  const r = 400 / mPerPx;
  let g = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--maple)" fill-opacity=".07" stroke="var(--maple)" stroke-dasharray="8 8" stroke-width="2.5"/>`;
  g += `<text x="${cx}" y="${cy - r - 10}" font-size="22" fill="var(--maple)" text-anchor="middle">步行約 5 分鐘範圍</text>`;
  it.filter(i => i.kind === 'convenience' && i.lat).forEach(i => { const [x, y] = px(m, i.lat, i.lon); g += `<circle cx="${x}" cy="${y}" r="9" fill="var(--line-tozai)" stroke="var(--surface)" stroke-width="3"/>`; });
  it.filter(i => i.kind === 'supermarket' && i.lat).forEach(i => { const [x, y] = px(m, i.lat, i.lon); g += `<rect x="${x - 9}" y="${y - 9}" width="18" height="18" fill="var(--good)" stroke="var(--surface)" stroke-width="3"/>`; });
  g += `<circle cx="${cx}" cy="${cy}" r="15" fill="var(--maple)" stroke="var(--surface)" stroke-width="4"/><text x="${cx + 22}" y="${cy + 9}" font-size="28" font-weight="700" fill="var(--maple)">${s.no} 住宿${s.approx ? '（大概位置）' : ''}</text>`;
  return geo(s.id, m, g) + `<div class="legend"><span><i style="background:var(--maple)"></i>住宿</span><span><i style="background:var(--line-tozai)"></i>便利商店</span><span><i style="background:var(--good);border-radius:0"></i>超市</span><span>車站名稱印在底圖上（綠字「〇〇駅」）</span></div>`;
}
const total = s => s.price == null ? null : s.price + s.fee;
const perPerson = s => s.price == null ? null : Math.round(total(s) / 7);

const gpos = s => `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;

const walkMin = m => Math.max(1, Math.round(m / 80));

// fill station walking distance from OSM routing
STAYS.forEach(s => {

/* ---------- compare table ---------- */
function renderTable(){
  const rows = [
    ['3 晚總價', s => total(s), money, 'min'],
    ['每人', s => perPerson(s), money, 'min'],
    ['每人每晚', s => s.price == null ? null : Math.round(total(s) / 21), money, 'min'],
    ['客廳沙發', s => SOFA[s.id][0], (v, s) => SOFA[s.id][1], 'max'],
    ['面積', s => s.size, v => v + '㎡', 'max'],
    ['每人面積', s => +(s.size / 7).toFixed(1), v => v + '㎡', 'max'],
    ['臥室', s => s.bedrooms, v => v + ' 間', 'max'],
    ['正式床（不含沙發床、日式床墊）', s => realBeds(s), v => v + ' 張', 'max'],
    ['廁所', s => s.toilets, v => v + ' 間', 'max'],
    ['淋浴', s => s.showers, v => v + ' 間', 'max'],
    ['浴缸', s => s.tubs, v => v ? v + ' 個' : '沒有', 'max'],
    ['最近車站步行', s => +stWalk(s.stations[0]), v => v + ' 分', 'min'],
    ['到新宿', s => s.transit[0].min, v => '約 ' + v + ' 分', 'min'],
    ['到澀谷', s => s.transit[1].min, v => '約 ' + v + ' 分', 'min'],
    ['到池袋', s => s.transit[2].min, v => '約 ' + v + ' 分', 'min'],
    ['600m 內便利商店', s => countKind(s, ['convenience']), v => v + ' 家', 'max'],
    ['600m 內餐飲', s => countKind(s, ['restaurant','fast_food','cafe','bar','pub']), v => v + ' 家', 'max'],
    ['評分', s => s.rating / s.ratingMax * 10, (v, s) => `${s.rating} / ${s.ratingMax}（${s.reviews} 則）`, 'max'],
    ['退房', s => parseInt(s.checkout), (v, s) => s.checkout, 'max']
  ];
  const warn = {
    '每人面積': v => v < 9, '客廳沙發': v => !v, '最近車站步行': v => v > 6, '到澀谷': v => v > 35, '到新宿': v => v > 30, '浴缸': v => v === 0
  };
  let h = '<thead><tr><th></th>' + STAYS.map(s => `<th scope="col"><span class="badge">${s.no}</span><b>${esc(s.name)}</b>${s.booked ? '<span class="pill booked">已訂</span>' : ''}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach(([label, get, show, dir]) => {
    const vals = STAYS.map(get);
    const known = vals.filter(v => v != null);
    const best = dir === 'min' ? Math.min(...known) : Math.max(...known);
    const unique = known.length > 1 && known.filter(v => v === best).length < known.length;
    h += `<tr><th scope="row">${label}</th>` + STAYS.map((s, i) => {
      if (vals[i] == null) return '<td class="num tbd">待補</td>';
      const cls = unique && vals[i] === best ? 'best' : (warn[label] && warn[label](vals[i]) ? 'bad' : '');
      return `<td class="num ${cls}">${show(vals[i], s)}</td>`;
    }).join('') + '</tr>';
  });
  h += '<tr><th scope="row">地址（Google 地圖）</th>' + STAYS.map(s => `<td style="font-size:13px">${addrLink(s)}</td>`).join('') + '</tr>';
  h += '<tr><th scope="row">換毛巾床單</th>' + STAYS.map(s => `<td class="${s.id === 'b2' ? 'bad' : ''}" style="font-size:13px">${esc(s.linen)}</td>`).join('') + '</tr>';
  $('#cmp').innerHTML = h + '</tbody>';
}
function realBeds(s){ let n = 0; s.layout.forEach(f => f.rooms.forEach(r => (r.beds || []).forEach(b => { if (b[2]) n += b[1]; }))); return n; }
function countKind(s, kinds){ const it = (NEAR[s.id] && NEAR[s.id].items) || []; return it.filter(i => kinds.includes(i.kind) && i.d <= 600).length; }

function renderMap(){

    {n:'池袋', lat:35.7295, lng:139.7109}
  ];
  let g = '';
  lm.forEach(p => { const [x, y] = px(m, p.lat, p.lng); g += `<rect x="${x - 10}" y="${y - 10}" width="20" height="20" rx="3" fill="var(--ink)"/><text x="${x - 16}" y="${y + 9}" font-size="26" font-weight="700" fill="var(--ink)" text-anchor="end">${p.n}</text>`; });

function capOf(s, p){ return p.cat + (p.cap ? '｜' + p.cap : ''); }
function galShow(j){
  const list = galList(cur); if (!list.length) return;
  galIdx = (j + list.length) % list.length;

  $('#galimg').src = 'photos/' + p.f; $('#galimg').alt = capOf(cur, p) || cur.name + ' 照片';
  $('#galcap').innerHTML = `<span class="cat-tag">${esc(p.cat)}</span>${esc(p.cap)}`;
  $('#galcount').textContent = `${galIdx + 1} / ${list.length}`;
  document.querySelectorAll('#thumbs button').forEach(b => b.setAttribute('aria-current', +b.dataset.j === galIdx));
  const t = document.querySelector(`#thumbs button[data-j="${galIdx}"]`);
  if (t) t.parentNode.scrollTo({left: t.offsetLeft - t.parentNode.clientWidth / 2 + 48, behavior:'smooth'});
  if (!$('#lb').hidden) lbSync();
}
function lbSync(){ const p = galList(cur)[galIdx]; $('#lbimg').src = 'photos/' + p.f; $('#lbimg').alt = capOf(cur, p); $('#lbcap').textContent = `${galIdx + 1} / ${galList(cur).length}  ${capOf(cur, p)}`; }
function lbOpen(){ $('#lb').hidden = false; lbSync(); $('#lbx').focus(); }
function lbClose(){ $('#lb').hidden = true; }
$('#lbx').addEventListener('click', lbClose);
$('#lbp').addEventListener('click', () => galShow(galIdx - 1));
$('#lbn').addEventListener('click', () => galShow(galIdx + 1));
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb') lbClose(); });
swipe($('#lb'), d => galShow(galIdx + d));
document.addEventListener('keydown', e => {
  if (!cur) return;
  const inLb = !$('#lb').hidden;
  if (e.key === 'Escape' && inLb) lbClose();
  if (e.key === 'ArrowLeft' && (inLb || document.activeElement.closest('.gal'))) galShow(galIdx - 1);
  if (e.key === 'ArrowRight' && (inLb || document.activeElement.closest('.gal'))) galShow(galIdx + 1);
});
function swipe(el, cb){
  let x0 = null;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  el.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) cb(dx < 0 ? 1 : -1); x0 = null; });
}
